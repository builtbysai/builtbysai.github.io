<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="cull-build" content="cull-v2-2026-10-23">
<title>Cull — gallery review</title>
<style>
  :root{
    --bg:#131315; --panel:#1c1c1f; --line:#333338; --ink:#ececea; --dim:#9a9a94;
    --keep:#3f9e4d; --del:#d0483e; --skip:#8f8f89; --merge:#8b7fd4; --warn:#e8b13c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;}
  button{font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line);
    padding:.5rem .8rem; cursor:pointer; border-radius:0}
  button:active{background:#26262a}
  input,select,textarea{font:inherit; color:var(--ink); background:#0d0d0f;
    border:1px solid var(--line); padding:.5rem; border-radius:0}
  textarea{width:100%; min-height:4.2rem; resize:vertical}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{position:sticky; top:0; z-index:30; background:var(--bg); border-bottom:1px solid var(--line);
    padding:.55rem .8rem .6rem}
  .hrow{display:flex; align-items:baseline; gap:.9rem; flex-wrap:wrap}
  h1{font-size:1rem; margin:0; letter-spacing:.14em; text-transform:uppercase; font-weight:600}
  #progress{color:var(--dim); font-size:.86rem}
  #savedState{margin-left:auto; color:var(--dim); font-size:.82rem}
  #unexported{color:var(--warn); font-size:.82rem}
  .tabs{display:flex; gap:.4rem; margin-top:.55rem; flex-wrap:wrap; align-items:center}
  .tabs button[aria-selected="true"]{background:var(--ink); color:#111; border-color:var(--ink); font-weight:600}
  .tabs .spacer{flex:1}
  .toolbar{display:flex; gap:.5rem; flex-wrap:wrap; padding:.6rem .8rem; border-bottom:1px solid var(--line)}
  .toolbar input[type="search"]{flex:1; min-width:8rem}
  #grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:2px; background:var(--line)}
  .tile{background:var(--bg); padding:0 0 .45rem; cursor:pointer; position:relative; border:0; text-align:left; width:100%; display:block}
  .tile img{width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#000}
  .tile .ph{width:100%; aspect-ratio:1; background:#000; color:var(--dim); display:flex;
    align-items:center; justify-content:center; font-size:1.6rem}
  .tile .cap{padding:.35rem .5rem 0; font-size:.8rem; line-height:1.3}
  .tile .cap .no{color:var(--dim)}
  .badges{display:flex; gap:.3rem; flex-wrap:wrap; padding:.3rem .5rem 0}
  .bdg{font-size:.68rem; letter-spacing:.06em; border:1px solid var(--line); padding:.05rem .35rem; color:var(--dim)}
  .bdg.keep{color:var(--keep); border-color:var(--keep)}
  .bdg.delete{color:var(--del); border-color:var(--del)}
  .bdg.skip{color:var(--skip); border-color:var(--skip)}
  .bdg.merge{color:var(--merge); border-color:var(--merge)}
  .bdg.broken{color:var(--warn); border-color:var(--warn)}
  .empty{padding:2.5rem 1rem; color:var(--dim); text-align:center}
  #loupe{max-width:860px; margin:0 auto; padding:.8rem .8rem 7.5rem}
  #loupe .meta{color:var(--dim); font-size:.88rem}
  #loupe h2{margin:.15rem 0 .2rem; font-size:1.25rem; font-weight:600}
  #pieceNote{color:var(--dim); margin:.3rem 0 .8rem; max-width:60ch}
  #healthLine{color:var(--warn); font-size:.9rem; margin:.4rem 0}
  #stage{background:#000; border:1px solid var(--line)}
  #stage img{width:100%; max-height:68vh; object-fit:contain; display:block}
  #stage iframe{width:100%; height:68vh; border:0; display:block; background:#000}
  #stage .ph{height:40vh; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:2rem}
  .stagebar{display:flex; gap:.5rem; margin:.6rem 0; flex-wrap:wrap; align-items:center}
  .stagebar .grow{flex:1}
  #noteZone{margin-top:.8rem; display:none}
  #noteZone.open{display:block}
  .chips{display:flex; gap:.4rem; flex-wrap:wrap; margin:.5rem 0}
  .chips button{font-size:.82rem; padding:.3rem .6rem}
  .decbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--bg);
    border-top:1px solid var(--line); display:flex; gap:2px; padding:.5rem; max-width:860px; margin:0 auto}
  .decbar button{flex:1; padding:.95rem .3rem; font-weight:600; letter-spacing:.04em}
  .decbar .b-del{color:var(--del)} .decbar .b-keep{color:var(--keep); flex:1.35}
  .decbar .b-merge{color:var(--merge)} .decbar .b-skip{color:var(--skip)}
  .navrow{display:flex; gap:.5rem; margin-top:.7rem}
  .navrow button{flex:1}
  #survey{padding:.8rem; max-width:1100px; margin:0 auto}
  .group{border-top:1px solid var(--line); padding:.8rem 0 1.2rem}
  .group h3{margin:0 0 .2rem; font-size:.95rem; letter-spacing:.08em; text-transform:uppercase; font-weight:600}
  .group .gstat{color:var(--dim); font-size:.85rem; margin-bottom:.6rem}
  .members{display:flex; gap:2px; flex-wrap:wrap; background:var(--line)}
  .member{background:var(--bg); width:calc(50% - 1px); max-width:300px; padding-bottom:.4rem; position:relative}
  @media(min-width:700px){ .member{width:calc(25% - 2px)} }
  .member img{width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#000}
  .member .ph{width:100%; aspect-ratio:1; background:#000; color:var(--dim); display:flex; align-items:center; justify-content:center; font-size:1.3rem}
  .member .cap{padding:.3rem .45rem 0; font-size:.78rem}
  .member .acts{display:flex; gap:.3rem; padding:.35rem .45rem 0}
  .member .acts button{flex:1; font-size:.78rem; padding:.35rem .2rem}
  .member.survivor{outline:2px solid var(--keep); outline-offset:-2px}
  .overlay{position:fixed; inset:0; background:rgba(8,8,10,.94); z-index:60; display:none; overflow:auto}
  .overlay.open{display:block}
  .sheet{max-width:860px; margin:0 auto; padding:1rem .9rem 3rem}
  .sheet h2{letter-spacing:.1em; text-transform:uppercase; font-size:1rem}
  .sheet textarea{min-height:45vh; width:100%; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.8rem}
  .orow{display:flex; gap:.5rem; flex-wrap:wrap; margin:.7rem 0}
  #toast{position:fixed; left:50%; transform:translateX(-50%); bottom:6.4rem; z-index:80;
    background:var(--ink); color:#111; padding:.55rem .9rem; display:none; font-size:.9rem}
  #toast.show{display:flex; gap:.8rem; align-items:center}
  #toast button{background:#111; color:var(--ink); border-color:#111; padding:.2rem .6rem}
  .pickgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:2px; background:var(--line); margin-top:.7rem}
  .hidden{display:none !important}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>Cull</h1>
    <span id="progress">loading…</span>
    <span id="unexported" class="hidden"></span>
    <span id="savedState"></span>
  </div>
  <nav class="tabs">
    <button id="tabGrid" aria-selected="true">Grid</button>
    <button id="tabLoupe" aria-selected="false">Loupe</button>
    <button id="tabSurvey" aria-selected="false">Survey</button>
    <span class="spacer"></span>
    <button id="btnExport">Export</button>
    <button id="btnImport">Import</button>
    <input type="file" id="fileImport" accept=".json,application/json" class="hidden">
  </nav>
</header>

<main id="viewGrid">
  <div class="toolbar">
    <select id="filterSel">
      <option value="unreviewed">Unreviewed</option>
      <option value="all">All</option>
      <option value="keep">Keep</option>
      <option value="delete">Delete</option>
      <option value="skip">Skip</option>
      <option value="merge">Merge</option>
      <option value="broken">Suspect broken</option>
      <option value="dups">Duplicate groups</option>
      <option value="notcaptured">Not captured yet</option>
    </select>
    <input type="search" id="searchBox" placeholder="Search title or No.">
  </div>
  <div id="grid"></div>
  <div id="gridEmpty" class="empty hidden">Nothing matches this filter.</div>
</main>

<main id="viewLoupe" class="hidden">
  <div id="loupe">
    <div class="meta mono" id="lpMeta"></div>
    <h2 id="lpTitle"></h2>
    <div id="pieceNote"></div>
    <div id="healthLine"></div>
    <div id="stage"></div>
    <div class="stagebar">
      <button id="btnLive">Run live</button>
      <button id="btnNote">Note</button>
      <button id="btnSurveyGo" class="hidden">Duplicate group</button>
      <span class="grow"></span>
      <span class="meta mono" id="lpPos"></span>
    </div>
    <div id="noteZone">
      <textarea id="noteText" placeholder="Note on this piece"></textarea>
      <div class="chips" id="chips"></div>
    </div>
    <div class="navrow">
      <button id="btnPrev">&larr; Prev</button>
      <button id="btnNext">Next &rarr;</button>
    </div>
  </div>
  <div class="decbar">
    <button class="b-del" id="btnDelete">Delete</button>
    <button class="b-skip" id="btnSkip">Skip</button>
    <button class="b-merge" id="btnMerge">Merge</button>
    <button class="b-keep" id="btnKeep">Keep</button>
  </div>
</main>

<main id="viewSurvey" class="hidden"><div id="survey"></div></main>

<div class="overlay" id="exportOverlay">
  <div class="sheet">
    <h2>Export</h2>
    <p style="color:var(--dim)">The JSON file is the source of truth. The Markdown below is the readable work list.</p>
    <div class="orow">
      <button id="btnDlJson">Download JSON</button>
      <button id="btnDlMd">Download Markdown</button>
      <button id="btnCopyMd">Copy Markdown</button>
      <button id="btnCloseExport">Close</button>
    </div>
    <textarea id="mdText" readonly></textarea>
  </div>
</div>

<div class="overlay" id="mergeOverlay">
  <div class="sheet">
    <h2 id="mergeTitle">Merge into&hellip;</h2>
    <input type="search" id="mergeSearch" placeholder="Search title or No." style="width:100%">
    <div class="pickgrid" id="mergeGrid"></div>
    <div class="orow"><button id="btnCloseMerge">Cancel</button></div>
  </div>
</div>

<div id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
'use strict';
/* Cull v2 — review app. Manifest (offline pipeline) + live index join.
   Decisions live in IndexedDB (fallback localStorage); the exported JSON
   file is the source of truth. */
const PIECE_URL = n => 'https://builtbysai.com/generative-doodles/' + n + '/';
const LIVE_INDEX = '/generative-doodles/pieces.json';
const SNIPPETS = ["doesn't load", 'transform', 'recolor', 'duplicate of ', 'merge candidate', 'blank / broken', 'strong', 'weak'];
const $ = id => document.getElementById(id);

let MANIFEST = null;          // {pieces:[...], dupGroups:{}}
let PIECES = new Map();       // n -> merged piece record
let ORDER = [];               // display order (live index order, then manifest-only)
let GONE = [];                // decided pieces no longer in the live index
let liveOk = false;
let records = {};             // n -> {d, mt, note, ej, ts}
let meta = { lastExportAt: 0 };
let view = 'grid';
let queue = [];               // current loupe queue (array of n)
let qpos = 0;
let lastChange = null;        // {n, prev} for undo
let toastTimer = null;

/* ---------- storage ---------- */
const store = (() => {
  let db = null, useLS = false;
  function idb() {
    return new Promise((res, rej) => {
      if (db) return res(db);
      const rq = indexedDB.open('cull-v2', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => { db = rq.result; res(db); };
      rq.onerror = () => rej(rq.error);
    });
  }
  async function get(key) {
    if (!useLS) {
      try {
        const d = await idb();
        return await new Promise((res, rej) => {
          const rq = d.transaction('kv').objectStore('kv').get(key);
          rq.onsuccess = () => res(rq.result);
          rq.onerror = () => rej(rq.error);
        });
      } catch (e) { useLS = true; }
    }
    const v = localStorage.getItem('cull-v2:' + key);
    return v ? JSON.parse(v) : undefined;
  }
  async function set(key, val) {
    if (!useLS) {
      try {
        const d = await idb();
        await new Promise((res, rej) => {
          const rq = d.transaction('kv', 'readwrite').objectStore('kv').put(val, key);
          rq.onsuccess = res; rq.onerror = () => rej(rq.error);
        });
        return;
      } catch (e) { useLS = true; }
    }
    localStorage.setItem('cull-v2:' + key, JSON.stringify(val));
  }
  return { get, set };
})();

let saveTimer = null;
function save() {
  $('savedState').textContent = 'saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await store.set('records', records);
    await store.set('meta', meta);
    $('savedState').textContent = 'saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    updateHeader();
  }, 250);
}
function requestPersist() {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

/* ---------- data ---------- */
async function loadData() {
  const [mRes] = await Promise.allSettled([fetch('manifest.json')]);
  if (mRes.status === 'fulfilled' && mRes.value.ok) MANIFEST = await mRes.value.json();
  else MANIFEST = { pieces: [], dupGroups: {} };
  let live = null;
  try {
    const r = await fetch(LIVE_INDEX);
    if (r.ok) { live = await r.json(); liveOk = true; }
  } catch (e) { /* offline / local test: manifest only */ }

  const manByN = new Map(MANIFEST.pieces.map(p => [p.n, p]));
  const seen = new Set();
  ORDER = [];
  if (live) {
    for (const lp of live) {
      seen.add(lp.n);
      const mp = manByN.get(lp.n);
      PIECES.set(lp.n, mp
        ? { ...mp, title: lp.title, date: lp.date, note: lp.note, captured: true }
        : { n: lp.n, title: lp.title, date: lp.date, note: lp.note, thumb: null,
            health: 'not-captured', healthReason: 'not captured yet', dupGroup: null, captured: false });
      ORDER.push(lp.n);
    }
  }
  for (const mp of MANIFEST.pieces) {
    if (!seen.has(mp.n)) {
      // In the manifest but not the live index: gone from the gallery.
      PIECES.set(mp.n, { ...mp, captured: true, gone: true });
      if (!live) ORDER.push(mp.n);
    }
  }
  const saved = await store.get('records');
  if (saved) records = saved;
  const savedMeta = await store.get('meta');
  if (savedMeta) meta = savedMeta;
  GONE = Object.keys(records).map(Number).filter(n => {
    const p = PIECES.get(n);
    return p && p.gone;
  });
  if (!live) GONE = [];
}

function rec(n) { return records[n] || null; }
function decisionOf(n) { const r = rec(n); return r && r.d ? r.d : null; }
function isBroken(p) { return p.health === 'missing' || p.health === 'suspect-broken'; }

function counts() {
  const c = { total: 0, reviewed: 0, keep: 0, delete: 0, skip: 0, merge: 0 };
  for (const n of ORDER) {
    const p = PIECES.get(n); if (!p || p.gone) continue;
    c.total++;
    const d = decisionOf(n);
    if (d) { c.reviewed++; c[d]++; }
  }
  return c;
}
function unexportedCount() {
  return Object.values(records).filter(r => r.ts > (meta.lastExportAt || 0)).length;
}
function updateHeader() {
  const c = counts();
  $('progress').textContent = `Reviewed ${c.reviewed} of ${c.total} · Keep ${c.keep} · Delete ${c.delete} · Skip ${c.skip} · Merge ${c.merge}`
    + (liveOk ? '' : ' · (live index unreachable)');
  const u = unexportedCount();
  const el = $('unexported');
  if (u >= 25) { el.textContent = `${u} unexported changes — export soon`; el.classList.remove('hidden'); }
  else if (u > 0) { el.textContent = `${u} unexported`; el.classList.remove('hidden'); }
  else el.classList.add('hidden');
}

/* ---------- shared tile html ---------- */
function badges(p) {
  const out = [];
  const d = decisionOf(p.n), r = rec(p.n);
  if (d === 'keep') out.push('<span class="bdg keep">KEEP</span>');
  if (d === 'delete') out.push('<span class="bdg delete">DELETE</span>');
  if (d === 'skip') out.push('<span class="bdg skip">SKIP</span>');
  if (d === 'merge') out.push(`<span class="bdg merge">MERGE &rarr; ${r && r.mt ? r.mt : '?'}</span>`);
  if (r && r.note) out.push('<span class="bdg">NOTE</span>');
  if (isBroken(p)) out.push('<span class="bdg broken">SUSPECT BROKEN</span>');
  if (p.health === 'not-captured') out.push('<span class="bdg broken">NOT CAPTURED</span>');
  if (p.dupGroup) out.push(`<span class="bdg dup">DUP ${p.dupGroup.toUpperCase()}</span>`);
  return out.length ? `<div class="badges">${out.join('')}</div>` : '';
}
function thumbHtml(p, cls) {
  return p.thumb
    ? `<img class="${cls || ''}" loading="lazy" src="${p.thumb}" alt="">`
    : `<div class="ph">${p.n}</div>`;
}

/* ---------- grid ---------- */
function filteredPieces() {
  const f = $('filterSel').value;
  const q = $('searchBox').value.trim().toLowerCase();
  let list = ORDER.map(n => PIECES.get(n)).filter(p => p && !p.gone);
  if (f === 'unreviewed') list = list.filter(p => !decisionOf(p.n));
  else if (['keep', 'delete', 'skip', 'merge'].includes(f)) list = list.filter(p => decisionOf(p.n) === f);
  else if (f === 'broken') list = list.filter(isBroken);
  else if (f === 'dups') list = list.filter(p => p.dupGroup);
  else if (f === 'notcaptured') list = list.filter(p => !p.captured);
  if (q) list = list.filter(p => String(p.n) === q || p.title.toLowerCase().includes(q));
  return list;
}
function renderGrid() {
  const list = filteredPieces();
  const g = $('grid');
  g.innerHTML = list.map(p =>
    `<button class="tile" data-n="${p.n}">${thumbHtml(p)}<div class="cap"><span class="no">No. ${p.n}</span> · ${esc(p.title)}</div>${badges(p)}</button>`
  ).join('');
  $('gridEmpty').classList.toggle('hidden', list.length > 0);
  g.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
    queue = list.map(p => p.n);
    qpos = queue.indexOf(Number(t.dataset.n));
    showView('loupe'); renderLoupe();
  }));
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
</script>

<script>
/* ---------- loupe ---------- */
let liveFrame = null;
function cur() { return PIECES.get(queue[qpos]); }
function killLive() {
  if (liveFrame) { liveFrame.src = 'about:blank'; liveFrame.remove(); liveFrame = null; $('btnLive').textContent = 'Run live'; }
}
function renderLoupe() {
  killLive();
  const p = cur();
  if (!p) { $('lpTitle').textContent = 'Queue empty'; $('stage').innerHTML = ''; $('lpMeta').textContent = ''; $('lpPos').textContent = ''; return; }
  $('lpMeta').textContent = `No. ${p.n} · ${p.date}`;
  $('lpTitle').textContent = p.title;
  $('pieceNote').textContent = p.note || '';
  $('healthLine').textContent = isBroken(p) ? `Suspect broken — ${p.healthReason}` : (p.health === 'not-captured' ? 'Not captured yet — thumbnail pending, Run live works.' : '');
  $('stage').innerHTML = p.thumb ? `<img src="${p.thumb}" alt="">` : `<div class="ph">${p.n}</div>`;
  $('lpPos').textContent = `${qpos + 1} / ${queue.length}`;
  $('btnSurveyGo').classList.toggle('hidden', !p.dupGroup);
  const r = rec(p.n);
  $('noteText').value = r && r.note ? r.note : '';
  $('noteZone').classList.remove('open');
  const chips = $('chips');
  chips.innerHTML = '';
  for (const s of SNIPPETS) {
    const b = document.createElement('button');
    b.textContent = s; b.type = 'button';
    b.addEventListener('click', () => {
      const t = $('noteText');
      t.value = (t.value ? t.value.replace(/\s*$/, '') + '; ' : '') + s;
      noteInput();
      t.focus();
    });
    chips.appendChild(b);
  }
  updateDecbar();
}
function updateDecbar() {
  const p = cur(); if (!p) return;
  const d = decisionOf(p.n);
  $('btnKeep').style.outline = d === 'keep' ? '2px solid var(--keep)' : '';
  $('btnDelete').style.outline = d === 'delete' ? '2px solid var(--del)' : '';
  $('btnSkip').style.outline = d === 'skip' ? '2px solid var(--skip)' : '';
  $('btnMerge').style.outline = d === 'merge' ? '2px solid var(--merge)' : '';
}
function noteInput() {
  const p = cur(); if (!p) return;
  const r = { ...(rec(p.n) || {}), note: $('noteText').value, ts: Date.now() };
  if (!r.d) delete r.d;
  records[p.n] = r; save();
}
function decide(d, mt) {
  const p = cur(); if (!p) return;
  requestPersist();
  const prev = rec(p.n) ? { ...rec(p.n) } : null;
  const r = { ...(prev || {}), d, ts: Date.now() };
  if (d === 'merge') r.mt = mt; else delete r.mt;
  records[p.n] = r;
  lastChange = { n: p.n, prev };
  save(); updateDecbar();
  const label = { keep: 'Keep', delete: 'Delete', skip: 'Skip', merge: 'Merge → ' + mt }[d];
  toast(`No. ${p.n} — ${label}`);
  advance();
}
function advance() {
  // next undecided after current position, else next item
  for (let i = qpos + 1; i < queue.length; i++) if (!decisionOf(queue[i])) { qpos = i; renderLoupe(); return; }
  for (let i = 0; i < qpos; i++) if (!decisionOf(queue[i])) { qpos = i; renderLoupe(); return; }
  if (qpos < queue.length - 1) { qpos++; renderLoupe(); }
  else renderLoupe();
}
function step(dir) {
  qpos = Math.min(queue.length - 1, Math.max(0, qpos + dir));
  renderLoupe();
}
function toast(msg) {
  $('toastMsg').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 5000);
}
function undo() {
  if (!lastChange) return;
  const { n, prev } = lastChange;
  if (prev) records[n] = prev; else delete records[n];
  lastChange = null;
  save();
  $('toast').classList.remove('show');
  if (view === 'loupe') { const i = queue.indexOf(n); if (i >= 0) qpos = i; renderLoupe(); }
  if (view === 'grid') renderGrid();
  if (view === 'survey') renderSurvey();
}

/* ---------- merge picker ---------- */
let mergeFor = null;
function openMerge() {
  const p = cur(); if (!p) return;
  mergeFor = p.n;
  $('mergeTitle').textContent = `Merge No. ${p.n} into…`;
  $('mergeSearch').value = '';
  renderMergeGrid('');
  $('mergeOverlay').classList.add('open');
}
function renderMergeGrid(q) {
  q = q.trim().toLowerCase();
  const list = ORDER.map(n => PIECES.get(n)).filter(p => p && !p.gone && p.n !== mergeFor)
    .filter(p => !q || String(p.n) === q || p.title.toLowerCase().includes(q)).slice(0, 120);
  $('mergeGrid').innerHTML = list.map(p =>
    `<button class="tile" data-n="${p.n}">${thumbHtml(p)}<div class="cap"><span class="no">No. ${p.n}</span> · ${esc(p.title)}</div></button>`).join('');
  $('mergeGrid').querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
    $('mergeOverlay').classList.remove('open');
    decide('merge', Number(t.dataset.n));
  }));
}

/* ---------- survey ---------- */
function groupResolved(members) {
  return members.every(n => { const r = rec(n); return (r && r.d) || (r && r.ej); });
}
function renderSurvey() {
  const groups = (MANIFEST && MANIFEST.dupGroups) || {};
  const keys = Object.keys(groups);
  const wrap = $('survey');
  if (!keys.length) { wrap.innerHTML = '<div class="empty">No duplicate groups in the manifest.</div>'; return; }
  wrap.innerHTML = keys.map(k => {
    const members = groups[k].map(n => PIECES.get(n)).filter(Boolean);
    const resolved = groupResolved(groups[k]);
    return `<section class="group"><h3>Group ${k.toUpperCase()} · ${members.length} pieces</h3>
      <div class="gstat">${resolved ? 'Resolved' : 'Unresolved'} — pick the survivor; the rest merge into it.</div>
      <div class="members">${members.map(p => {
        const r = rec(p.n);
        const surv = r && r.d === 'merge' ? null : (members.find(m => { const mr = rec(m.n); return mr && mr.d === 'keep' && members.some(x => { const xr = rec(x.n); return xr && xr.d === 'merge' && xr.mt === m.n; }); }));
        const isSurv = r && r.d === 'keep' && members.some(x => { const xr = rec(x.n); return xr && xr.d === 'merge' && xr.mt === p.n; });
        return `<div class="member ${isSurv ? 'survivor' : ''}" data-n="${p.n}">${thumbHtml(p)}
          <div class="cap"><span class="no">No. ${p.n}</span> · ${esc(p.title)}</div>${badges(p)}
          <div class="acts"><button data-act="surv">Survivor</button><button data-act="open">Open</button><button data-act="eject">Eject</button></div></div>`;
      }).join('')}</div></section>`;
  }).join('');
  wrap.querySelectorAll('.member').forEach(m => {
    const n = Number(m.dataset.n);
    m.querySelector('[data-act="open"]').addEventListener('click', () => {
      const grp = (MANIFEST.dupGroups[m.closest('.group').querySelector('h3').textContent.split(' ')[1].toLowerCase()] || []);
      queue = ORDER.filter(x => PIECES.get(x) && !PIECES.get(x).gone);
      qpos = Math.max(0, queue.indexOf(n));
      showView('loupe'); renderLoupe();
    });
    m.querySelector('[data-act="eject"]').addEventListener('click', () => {
      const prev = rec(n) ? { ...rec(n) } : null;
      records[n] = { ...(prev || {}), ej: true, ts: Date.now() };
      lastChange = { n, prev };
      save(); renderSurvey(); toast(`No. ${n} ejected from group`);
    });
    m.querySelector('[data-act="surv"]').addEventListener('click', () => {
      const h3 = m.closest('.group').querySelector('h3').textContent;
      const key = h3.split(' ')[1].toLowerCase();
      const members = MANIFEST.dupGroups[key];
      const others = members.filter(x => x !== n);
      if (!confirm(`Make No. ${n} the survivor? ${others.length} other piece(s) will be marked merge → ${n}.`)) return;
      for (const x of members) {
        if (x === n) records[x] = { ...(rec(x) || {}), d: 'keep', ts: Date.now() };
        else { const r = { ...(rec(x) || {}), d: 'merge', mt: n, ts: Date.now() }; records[x] = r; }
        delete records[x].ej;
      }
      save(); renderSurvey(); toast(`Group ${key.toUpperCase()}: survivor No. ${n}`);
    });
  });
}

/* ---------- export / import ---------- */
function exportJson() {
  return { app: 'cull', version: 2, exportedAt: new Date().toISOString(), records };
}
function entryLine(p, extra) {
  return `- No. ${p.n} — ${p.title} — ${p.date}${extra || ''}`;
}
function noteLine(r) { return r && r.note ? `\n  Note: ${r.note.replace(/\n/g, ' ')}` : ''; }
function buildMarkdown() {
  const c = counts();
  const lines = [];
  lines.push('# Gallery cull — work list');
  lines.push('');
  lines.push(`Reviewed ${c.reviewed} of ${c.total} · Keep ${c.keep} · Delete ${c.delete} · Skip ${c.skip} · Merge ${c.merge} · Unreviewed ${c.total - c.reviewed}`);
  lines.push(`Exported ${new Date().toLocaleString()}`);
  const byDec = d => ORDER.map(n => PIECES.get(n)).filter(p => p && !p.gone && decisionOf(p.n) === d);
  lines.push('', '## Delete', '');
  byDec('delete').forEach(p => lines.push(entryLine(p) + noteLine(rec(p.n))));
  lines.push('', '## Skip', '');
  byDec('skip').forEach(p => lines.push(entryLine(p) + noteLine(rec(p.n))));
  lines.push('', '## Merge', '');
  byDec('merge').forEach(p => {
    const r = rec(p.n); const t = r && r.mt ? PIECES.get(r.mt) : null;
    lines.push(entryLine(p, ` → merges into No. ${r ? r.mt : '?'}${t ? ' — ' + t.title : ''}`) + noteLine(r));
  });
  lines.push('', '## Notes', '');
  ORDER.map(n => PIECES.get(n)).filter(p => p && !p.gone && rec(p.n) && rec(p.n).note)
    .forEach(p => lines.push(entryLine(p) + noteLine(rec(p.n))));
  lines.push('', '## Suspect broken', '');
  ORDER.map(n => PIECES.get(n)).filter(p => p && !p.gone && isBroken(p))
    .forEach(p => lines.push(entryLine(p, ` — ${p.healthReason}`)));
  if (GONE.length) {
    lines.push('', '## No longer in gallery', '');
    GONE.forEach(n => { const p = PIECES.get(n); const r = rec(n); if (p) lines.push(entryLine(p, ` — decision: ${r && r.d ? r.d : 'none'}`) + noteLine(r)); });
  }
  return lines.join('\n');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function stamp() { return new Date().toISOString().slice(0, 10); }

/* ---------- views ---------- */
function showView(v) {
  view = v;
  killLive();
  $('viewGrid').classList.toggle('hidden', v !== 'grid');
  $('viewLoupe').classList.toggle('hidden', v !== 'loupe');
  $('viewSurvey').classList.toggle('hidden', v !== 'survey');
  $('tabGrid').setAttribute('aria-selected', v === 'grid');
  $('tabLoupe').setAttribute('aria-selected', v === 'loupe');
  $('tabSurvey').setAttribute('aria-selected', v === 'survey');
  if (v === 'grid') renderGrid();
  if (v === 'survey') renderSurvey();
  window.scrollTo(0, 0);
}

/* ---------- wiring ---------- */
$('tabGrid').addEventListener('click', () => showView('grid'));
$('tabSurvey').addEventListener('click', () => showView('survey'));
$('tabLoupe').addEventListener('click', () => {
  if (!queue.length) queue = filteredPieces().map(p => p.n);
  if (!queue.length) queue = ORDER.filter(n => !PIECES.get(n).gone);
  qpos = Math.min(qpos, queue.length - 1);
  showView('loupe'); renderLoupe();
});
$('filterSel').addEventListener('change', renderGrid);
$('searchBox').addEventListener('input', renderGrid);
$('btnKeep').addEventListener('click', () => decide('keep'));
$('btnDelete').addEventListener('click', () => decide('delete'));
$('btnSkip').addEventListener('click', () => decide('skip'));
$('btnMerge').addEventListener('click', openMerge);
$('btnPrev').addEventListener('click', () => step(-1));
$('btnNext').addEventListener('click', () => step(1));
$('toastUndo').addEventListener('click', undo);
$('btnNote').addEventListener('click', () => { $('noteZone').classList.toggle('open'); $('noteText').focus(); });
$('noteText').addEventListener('input', noteInput);
$('btnLive').addEventListener('click', () => {
  const p = cur(); if (!p) return;
  if (liveFrame) { killLive(); renderLoupeStageOnly(); return; }
  const stage = $('stage');
  stage.innerHTML = '';
  liveFrame = document.createElement('iframe');
  liveFrame.src = PIECE_URL(p.n);
  liveFrame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
  stage.appendChild(liveFrame);
  $('btnLive').textContent = 'Stop live';
});
function renderLoupeStageOnly() {
  const p = cur(); if (!p) return;
  $('stage').innerHTML = p.thumb ? `<img src="${p.thumb}" alt="">` : `<div class="ph">${p.n}</div>`;
}
$('btnSurveyGo').addEventListener('click', () => showView('survey'));
$('mergeSearch').addEventListener('input', e => renderMergeGrid(e.target.value));
$('btnCloseMerge').addEventListener('click', () => $('mergeOverlay').classList.remove('open'));
$('btnExport').addEventListener('click', () => { $('mdText').value = buildMarkdown(); $('exportOverlay').classList.add('open'); });
$('btnCloseExport').addEventListener('click', () => $('exportOverlay').classList.remove('open'));
$('btnDlJson').addEventListener('click', () => {
  download(`cull-decisions-${stamp()}.json`, JSON.stringify(exportJson(), null, 1), 'application/json');
  meta.lastExportAt = Date.now(); save();
});
$('btnDlMd').addEventListener('click', () => {
  download(`cull-work-list-${stamp()}.md`, buildMarkdown(), 'text/markdown');
  meta.lastExportAt = Date.now(); save();
});
$('btnCopyMd').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('mdText').value); toast('Markdown copied'); } catch (e) { $('mdText').select(); }
});
$('btnImport').addEventListener('click', () => $('fileImport').click());
$('fileImport').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const incoming = data.records || data.decisions || {};
    let added = 0, updated = 0;
    for (const [k, r] of Object.entries(incoming)) {
      const n = Number(k);
      const local = records[n];
      if (!local) { records[n] = r; added++; }
      else if ((r.ts || 0) > (local.ts || 0)) { records[n] = r; updated++; }
    }
    save(); updateHeader();
    if (view === 'grid') renderGrid();
    toast(`Import: ${added} new, ${updated} updated`);
  } catch (err) { toast('Import failed: not a cull JSON file'); }
  e.target.value = '';
});
document.addEventListener('keydown', e => {
  if (view !== 'loupe' || $('mergeOverlay').classList.contains('open') || $('exportOverlay').classList.contains('open')) return;
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'arrowright') step(1);
  else if (k === 'arrowleft') step(-1);
  else if (k === 'k') decide('keep');
  else if (k === 'd') decide('delete');
  else if (k === 's') decide('skip');
  else if (k === 'm') openMerge();
  else if (k === 'z') undo();
  else if (k === 'l') $('btnLive').click();
});

/* ---------- boot ---------- */
(async () => {
  try {
    await loadData();
  } catch (e) {
    $('progress').textContent = 'Failed to load manifest: ' + e.message;
    return;
  }
  updateHeader();
  queue = filteredPieces().map(p => p.n);
  qpos = 0;
  renderGrid();
  $('savedState').textContent = Object.keys(records).length ? 'saved decisions loaded' : '';
})();
</script>
</body>
</html>
