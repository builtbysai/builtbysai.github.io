<!DOCTYPE html>
<!-- 876-beast-of-himself v2 : Lascaux -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beast of Himself — №876</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #e9dcbf;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

    font-family: Georgia, "Times New Roman", serif;

    -webkit-user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: block;

    cursor: pointer;
  }
  .label {
    position: fixed;
    z-index: 2;

    transition: opacity 0.6s ease;
  }
  .label.hidden { opacity: 0; }
  #corner {
    top: 20px; left: 22px;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #6b6151;
  }
  #corner .d {
    margin-top: 5px;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #8a7f6c;
  }
  #foot {
    left: 0; right: 0; bottom: 22px;
    text-align: center;
    padding: 0 20px;
  }
  #foot .r {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #6b6151;
  }
  #foot .h {
    margin-top: 6px;

  @media (max-width: 600px) {

  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="corner" class="label">№ 876 · Beast of Himself<div class="d">2004 · 06 · 05</div></div>
<div id="foot" class="label">
  <div class="r" id="readout">man · stone 0%</div>
  <div class="h">drag up to hold him upright · tap to change him</div>
</div>
<script>
(function () {
  "use strict";

  // He who makes a beast of himself gets rid of the pain of being a man.
  //
  // A figure walks under a stone that grows with every sober step.
  // The load bends the spine and slows the pace. At the threshold the
  // figure drops to all fours: the stone rolls off, the pace surges,
  // the spine goes flat and low. But the beast cannot see the light
  // the man walked toward; it dims out of reach, and the beast's world
  // is only the ground line. After a run the figure rises again on its
  // own, the stone returns small, the light returns, and the load
  // starts growing again. Drag up to hold him upright against the
  // load. Tap to change him on demand. The cycle is the piece.
  //
  // LOOK v2: Lascaux. Mineral pigment on limestone — red and yellow
  // ochre, manganese black, white clay. One monumental silhouette, no
  // limbs, no anatomy: a tall leaning monolith that bows under the
  // stone, then collapses into a long low ridge and races. The sun is
  // a low amber disc with a blown-pigment halo; the wall itself is the
  // picture, speckled, washed, signed with faint red marks far off.

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var readout = document.getElementById("readout");
  var labels = document.querySelectorAll(".label");

  var W = 0, H = 0, DPR = 1, S = 1;
  var last = performance.now();
  var labelsShown = true;

  // Lascaux palette
  var WALL = "#e9dcbf";
  var WALL_DEEP = "#d9c49a";
  var GROUND = "#c8ad7d";
  var INK = "#241d15";
  var OCHRE_RED = "#a44a24";
  var OCHRE_YEL = "#c98a2d";
  var CLAY = "#f4ecda";

  // --- driver constants (tuned so one full cycle is ~55s) ---
  var LOAD_STEP = 0.02;      // load gained per step (50 steps to the drop)
  var BEAST_MS = 18000;      // how long the beast runs before rising
  var FALL_MS = 900;         // man -> beast transition
  var RISE_MS = 1000;        // beast -> man transition
  var BEND0 = 8;             // spine degrees from vertical, unloaded
  var BEND1 = 58;            // spine degrees from vertical, full load
  var V_MAN0 = 0.052;        // man pace, fraction of W per second, unloaded
  var V_MAN1 = 0.021;        // man pace at full load
  var V_BEAST = 0.072;       // beast pace, fraction of W per second
  var STONE_R0 = 14;         // stone radius px (x S), unloaded
  var STONE_R1 = 40;         // stone radius px (x S), full load

  // --- state ---
  var x = 0;                 // figure position, px
  var phase = "man";         // man | falling | beast | rising
  var load = 0;              // 0..1, the pain
  var c = 0;                 // crouch 0 = upright man, 1 = flat beast
  var transT = 0;            // transition progress 0..1
  var beastT = 0;            // time spent as beast, ms
  var walkPhase = 0;         // step phase, man
  var trotPhase = 0;         // step phase, beast
  var stepCount = 0;         // completed steps (load grows per step)
  var lightA = 1;            // light brightness 0..1
  var lift = 0;              // drag hold 0..1 (0 = sagging, 1 = held upright)
  var dragging = false;
  var dragStartY = 0;
  var bendAtFall = BEND0;    // bend when the drop began
  var looseStone = null;     // the stone after it rolls off
  var stoneFactors = [];     // irregular boulder outline, deterministic
  var dust = [];             // dust puffs: {x, y, r, vx, vy, age, life}
  var lastStepSeen = 0;
  var lastDustT = 0;

  for (var i = 0; i < 9; i++) {
    var f = Math.sin(i * 127.1) * 43758.5453;
    stoneFactors.push(0.86 + 0.28 * (f - Math.floor(f)));
  }

  // deterministic pseudo-random in [0,1) from an integer seed
  function rnd(seed) {
    var f = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
    return f - Math.floor(f);
  }

  // wall speckle: fractions of W/H, precomputed once
  var wallSpeck = [], groundSpeck = [], pebbles = [], signs = [], sunSpray = [];
  var i;
  for (i = 0; i < 380; i++) {
    wallSpeck.push({ fx: rnd(i * 3 + 1), fy: rnd(i * 3 + 2) * 0.78, r: 0.5 + rnd(i * 3 + 3) * 1.4, d: rnd(i * 7 + 5) > 0.5 });
  }
  for (i = 0; i < 220; i++) {
    groundSpeck.push({ fx: rnd(i * 5 + 11), fy: 0.80 + rnd(i * 5 + 12) * 0.19, r: 0.5 + rnd(i * 5 + 13) * 1.6, d: rnd(i * 9 + 15) > 0.5 });
  }
  for (i = 0; i < 9; i++) {
    pebbles.push({ fx: 0.06 + rnd(i * 13 + 21) * 0.88, fy: 0.84 + rnd(i * 13 + 22) * 0.13, rx: (2.5 + rnd(i * 13 + 23) * 4) });
  }
  // faint red signs far off near the horizon, Lascaux's abstract marks
  signs = [
    { fx: 0.08, fy: 0.735, k: "dots" }, { fx: 0.16, fy: 0.755, k: "stroke" },
    { fx: 0.30, fy: 0.72, k: "dots" }, { fx: 0.55, fy: 0.75, k: "arc" },
    { fx: 0.88, fy: 0.74, k: "dots" }, { fx: 0.94, fy: 0.76, k: "stroke" }
  ];
  for (i = 0; i < 46; i++) {
    var a = rnd(i * 17 + 31) * Math.PI * 2;
    var rr = 1.15 + rnd(i * 17 + 32) * 0.9;
    sunSpray.push({ dx: Math.cos(a) * rr, dy: Math.sin(a) * rr * 0.9, r: 0.6 + rnd(i * 17 + 33) * 1.1 });
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    S = Math.max(0.7, Math.min(1.25, Math.min(W, H) / 640));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function groundY() { return H * 0.80; }
  function lightPos() { return { x: W * 0.74, y: H * 0.16 }; }

  function bendFor(l) { return BEND0 + (BEND1 - BEND0) * l; }

  // Current spine angle from vertical, degrees. 0 = upright, 90 = flat.
  function spineDeg() {
    var upright = bendFor(load) * (1 - 0.75 * lift);
    return upright + (88 - upright) * c;
  }

  function manPace() { return W * (V_MAN0 - (V_MAN0 - V_MAN1) * load); }
  function pace() { return manPace() + (W * V_BEAST - manPace()) * c; }

  function stoneR() { return (STONE_R0 + (STONE_R1 - STONE_R0) * load) * S; }

  // The figure's form, in the current crouch:
  // tall monolith upright, long low ridge as a beast.
  function formLen() {
    var lenMan = H * 0.52;
    var lenBeast = Math.min(H * 0.30, W * 0.45);
    return lenMan + (lenBeast - lenMan) * c;
  }
  function formHalfW() {
    return H * (0.038 + (0.017 - 0.038) * c) * 2.2;
  }

  function exposedPhase() {
    return (phase === "man" || phase === "rising") ? "man" : "beast";
  }

  function startFall() {
    if (phase === "falling" || phase === "beast") return;
    bendAtFall = spineDeg();
    phase = "falling";
    transT = 0;
  }

  function startRise() {
    if (phase === "rising" || phase === "man") return;
    phase = "rising";
    transT = 0;
    load = 0.10; // the stone returns small
  }

  function toggle() {
    if (exposedPhase() === "man") startFall(); else startRise();
  }

  function spawnLooseStone(sx, sy, r) {
    looseStone = {
      x: sx, y: sy, r: r,
      vx: pace() * 1.7, rot: 0, alpha: 1, age: 0
    };
  }

  // Point on the spine at fraction t (0 = base, 1 = top), with the
  // stone's shoulder anchor at t = 0.62. Returns {x, y, nx, ny} where
  // (nx, ny) is the back-side normal (away from the sun).
  function spinePoint(t, leanRad, len, bx, by, bow) {
    var dirX = Math.sin(leanRad), dirY = -Math.cos(leanRad);
    // back-side normal: rotate dir by -90deg in screen space, then
    // flip so it points away from the sun (sun is to the right)
    var nx = dirY, ny = -dirX;
    if (nx > 0) { nx = -nx; ny = -ny; }
    var mx = bx + dirX * len * 0.5 + nx * bow;
    var my = by + dirY * len * 0.5 + ny * bow;
    // quadratic bezier base -> mid -> top
    var tx = bx + dirX * len, ty = by + dirY * len;
    var u = 1 - t;
    var px = u * u * bx + 2 * u * t * mx + t * t * tx;
    var py = u * u * by + 2 * u * t * my + t * t * ty;
    // tangent from the bezier derivative
    var dx = 2 * u * (mx - bx) + 2 * t * (tx - mx);
    var dy = 2 * u * (my - by) + 2 * t * (ty - my);
    var dl = Math.sqrt(dx * dx + dy * dy) || 1;
    dx /= dl; dy /= dl;
    var nnx = dy, nny = -dx;
    if (nnx > 0) { nnx = -nnx; nny = -nny; }
    return { x: px, y: py, nx: nnx, ny: nny, tx: dx, ty: dy };
  }

  function shoulderPos() {
    var lean = spineDeg() * Math.PI / 180;
    var len = formLen();
    var bow = load * len * 0.10 * (1 - c);
    var sp = spinePoint(0.62, lean, len, x, groundY(), bow);
    var r = stoneR();
    return {
      x: sp.x + sp.nx * (r * 0.45 + formHalfW() * 0.55),
      y: sp.y + sp.ny * (r * 0.45 + formHalfW() * 0.55)
    };
  }

  function spawnDust(px, py, n, spread, up) {
    for (var k = 0; k < n; k++) {
      if (dust.length > 26) return;
      dust.push({
        x: px + (rnd(performance.now() + k * 31) - 0.5) * spread,
        y: py - rnd(performance.now() + k * 47) * 6 * S,
        r: (2 + rnd(k * 13 + 7) * 4) * S,
        vx: -(6 + rnd(k * 19 + 3) * 14) * S,
        vy: -(4 + rnd(k * 23 + 9) * 10) * S * (up ? 1 : 0.4),
        age: 0, life: 0.9 + rnd(k * 29 + 5) * 0.5
      });
    }
  }

  function update(dt) {
    var dtms = dt * 1000;

    // drag hold sags back after release: ~0.25% left after 3s
    if (!dragging) lift *= Math.exp(-dt * 2.0);

    // transitions
    if (phase === "falling") {
      transT += dtms / FALL_MS;
      var prevC = c;
      c = Math.min(1, transT);
      // the stone rolls off partway down
      if (prevC < 0.35 && c >= 0.35 && !looseStone) {
        var sh = shoulderPos();
        spawnLooseStone(sh.x, sh.y, stoneR());
      }
      if (transT >= 1) { phase = "beast"; beastT = 0; c = 1; }
    } else if (phase === "rising") {
      transT += dtms / RISE_MS;
      c = Math.max(0, 1 - transT);
      if (transT >= 1) { phase = "man"; c = 0; }
    } else if (phase === "beast") {
      beastT += dtms;
      if (beastT >= BEAST_MS) startRise();
    }

    // steps and load: the stone grows with every sober step
    if (phase === "man") {
      var cadence = 1.9 - 1.0 * load; // steps per second, slower under load
      walkPhase += dt * cadence * Math.PI;
      var steps = Math.floor(walkPhase / Math.PI);
      if (steps > stepCount) {
        load = Math.min(1, load + LOAD_STEP * (steps - stepCount));
        stepCount = steps;
      }
      if (load >= 1) startFall();
    } else {
      trotPhase += dt * 3.4 * Math.PI;
    }

    // dust: a puff at the base on each step; a low trail while a beast
    if (stepCount > lastStepSeen) {
      spawnDust(x, groundY(), 3, 14 * S, true);
      lastStepSeen = stepCount;
    }
    if (phase === "beast" || phase === "falling") {
      lastDustT += dt;
      if (lastDustT > 0.16) {
        spawnDust(x - formLen() * 0.4, groundY(), 2, 10 * S, false);
        lastDustT = 0;
      }
    }
    for (var di = dust.length - 1; di >= 0; di--) {
      var d = dust[di];
      d.age += dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.vx *= Math.exp(-dt * 1.2);
      if (d.age > d.life) dust.splice(di, 1);
    }

    // the light: bright for the man, out of reach for the beast
    var target = (c > 0.5) ? 0.12 : 1.0;
    lightA += (target - lightA) * Math.min(1, dt * 1.6);

    // loose stone rolls and fades
    if (looseStone) {
      looseStone.age += dt;
      looseStone.x += looseStone.vx * dt;
      looseStone.vx *= Math.exp(-dt * 1.5);
      looseStone.rot += looseStone.vx * dt / Math.max(4, looseStone.r);
      if (looseStone.age > 1.0) looseStone.alpha = Math.max(0, 1 - (looseStone.age - 1.0) / 0.8);
      if (looseStone.alpha <= 0) looseStone = null;
    }

    // walk on, forever, left to right
    x += pace() * dt;
    if (x > W + 60) x = -60;
  }

  function boulder(cx, cy, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 9; i++) {
      var a = rot + (i / 9) * Math.PI * 2;
      var rr = r * stoneFactors[i];
      var px = cx + Math.cos(a) * rr;
      var py = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = OCHRE_RED;
    ctx.fill();
    ctx.lineWidth = 2 * S;
    ctx.strokeStyle = INK;
    ctx.stroke();
    // pale rim light on the sun side (upper right arc)
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.92, -1.2, 0.7);
    ctx.strokeStyle = CLAY;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 1.6 * S;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawWall() {
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    // broad deeper staining on the wall: irregular blotches, no clean edge
    function stain(cx, cy, rx, ry, alpha) {
      ctx.fillStyle = WALL_DEEP;
      ctx.globalAlpha = alpha;
      var blobs = [
        [0, 0, 1.0], [0.45, 0.18, 0.62], [-0.5, 0.12, 0.55],
        [0.15, -0.35, 0.5], [-0.2, -0.28, 0.42], [0.7, -0.1, 0.38]
      ];
      for (var b = 0; b < blobs.length; b++) {
        ctx.beginPath();
        ctx.ellipse(cx + blobs[b][0] * rx, cy + blobs[b][1] * ry,
          rx * blobs[b][2] * 0.55, ry * blobs[b][2] * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    stain(W * 0.18, H * 0.30, W * 0.20, H * 0.18, 0.10);
    stain(W * 0.85, H * 0.55, W * 0.16, H * 0.14, 0.10);
    stain(W * 0.45, H * 0.08, W * 0.24, H * 0.09, 0.08);

    // speckle across the wall
    var i, s;
    for (i = 0; i < wallSpeck.length; i++) {
      s = wallSpeck[i];
      ctx.fillStyle = s.d ? "rgba(120,96,58,0.16)" : "rgba(244,236,218,0.20)";
      ctx.fillRect(s.fx * W, s.fy * H, s.r, s.r);
    }

    // the sky answers the sun: a broad diluted red-ochre wash band
    var lp = lightPos();
    ctx.fillStyle = OCHRE_RED;
    ctx.globalAlpha = 0.10 * lightA;
    ctx.beginPath(); ctx.ellipse(lp.x, lp.y, W * 0.42, H * 0.13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.07 * lightA;
    ctx.beginPath(); ctx.ellipse(lp.x, lp.y, W * 0.55, H * 0.19, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // faint red signs far off near the horizon
    ctx.strokeStyle = OCHRE_RED;
    ctx.fillStyle = OCHRE_RED;
    ctx.globalAlpha = 0.38;
    ctx.lineWidth = 1.4 * S;
    var j, g;
    for (j = 0; j < signs.length; j++) {
      g = signs[j];
      var sx = g.fx * W, sy = g.fy * H;
      if (g.k === "dots") {
        ctx.beginPath(); ctx.arc(sx, sy, 2 * S, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx + 8 * S, sy + 3 * S, 1.6 * S, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx + 4 * S, sy - 6 * S, 1.4 * S, 0, Math.PI * 2); ctx.fill();
      } else if (g.k === "stroke") {
        ctx.beginPath(); ctx.moveTo(sx, sy - 6 * S); ctx.lineTo(sx + 2 * S, sy + 7 * S); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx + 7 * S, sy - 4 * S); ctx.lineTo(sx + 9 * S, sy + 6 * S); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(sx, sy, 7 * S, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // the beast dims the whole sky a touch
    if (lightA < 0.9) {
      ctx.fillStyle = "rgba(36,29,21," + (0.10 * (1 - lightA)).toFixed(3) + ")";
      ctx.fillRect(0, 0, W, groundY());
    }
  }

  function drawLight() {
    var lp = lightPos();
    var r = 24 * S;
    var a = lightA;
    // blown-pigment halo: layered faint rings
    var k;
    ctx.lineWidth = 1;
    for (k = 0; k < 4; k++) {
      ctx.strokeStyle = "rgba(201,138,45," + (0.20 * a / (k + 1)).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(lp.x, lp.y, r * (1.7 + k * 0.9), 0, Math.PI * 2); ctx.stroke();
    }
    // spray dots around the disc
    ctx.fillStyle = "rgba(201,138,45," + (0.35 * a).toFixed(3) + ")";
    for (k = 0; k < sunSpray.length; k++) {
      var sp = sunSpray[k];
      ctx.beginPath();
      ctx.arc(lp.x + sp.dx * r, lp.y + sp.dy * r, sp.r * S, 0, Math.PI * 2);
      ctx.fill();
    }
    // the disc itself: warm ochre for the man, pale ghost for the beast
    if (a > 0.5) {
      ctx.fillStyle = "rgba(201,138,45," + (0.25 + 0.75 * a).toFixed(3) + ")";
    } else {
      ctx.fillStyle = "rgba(216,201,168," + (0.35 + 0.4 * a).toFixed(3) + ")";
    }
    ctx.beginPath(); ctx.arc(lp.x, lp.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(164,74,36," + (0.5 * a).toFixed(3) + ")";
    ctx.lineWidth = 1.4 * S;
    ctx.beginPath(); ctx.arc(lp.x, lp.y, r * 1.02, 0, Math.PI * 2); ctx.stroke();
  }

  function drawGround() {
    var gy = groundY();
    // the floor: a filled band with a wavy rock contour for a horizon
    ctx.beginPath();
    ctx.moveTo(0, gy + Math.sin(0) * 3 * S);
    var px;
    for (px = 0; px <= W; px += 24) {
      ctx.lineTo(px, gy + Math.sin(px / W * Math.PI * 2.2) * 4 * S + Math.sin(px / W * Math.PI * 5.0) * 2 * S);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = GROUND;
    ctx.fill();
    // contour line along the horizon
    ctx.beginPath();
    ctx.moveTo(0, gy);
    for (px = 0; px <= W; px += 24) {
      ctx.lineTo(px, gy + Math.sin(px / W * Math.PI * 2.2) * 4 * S + Math.sin(px / W * Math.PI * 5.0) * 2 * S);
    }
    ctx.strokeStyle = "rgba(36,29,21,0.55)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // speckle and pebbles on the floor
    var i, s;
    for (i = 0; i < groundSpeck.length; i++) {
      s = groundSpeck[i];
      ctx.fillStyle = s.d ? "rgba(120,96,58,0.20)" : "rgba(244,236,218,0.18)";
      ctx.fillRect(s.fx * W, s.fy * H, s.r, s.r);
    }
    ctx.fillStyle = "rgba(36,29,21,0.35)";
    for (i = 0; i < pebbles.length; i++) {
      var p = pebbles[i];
      ctx.beginPath();
      ctx.ellipse(p.fx * W, p.fy * H, p.rx * S, p.rx * 0.55 * S, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // the figure's long shadow, away from the sun: a tapered wedge,
    // wide at the base, narrowing as it runs left
    var shLen = H * 0.26 * (0.4 + 0.6 * lightA);
    var shH = (9 - 5 * c) * S;
    ctx.fillStyle = "rgba(36,29,21," + (0.16 * lightA).toFixed(3) + ")";
    ctx.beginPath();
    ctx.moveTo(x + 6 * S, gy + 4 * S);
    ctx.lineTo(x - shLen, gy + 4 * S + shH * 0.35);
    ctx.lineTo(x - shLen, gy + 4 * S + shH);
    ctx.lineTo(x + 6 * S, gy + 4 * S + shH * 1.5);
    ctx.closePath();
    ctx.fill();
  }

  function drawFigure() {
    var gy = groundY();
    var len = formLen();
    var halfW = formHalfW();
    var lean = (spineDeg() + (1 - c) * 1.6 * Math.sin(walkPhase)) * Math.PI / 180;
    var bow = load * len * 0.10 * (1 - c);
    // the base rocks a little with each step; planted a few px into
    // the ground so both base corners sit in the floor
    var bx = x + (1 - c) * 2 * S * Math.sin(walkPhase);
    var by = gy + 8 * S;

    var N = 14;
    var pts = [], i, t;
    for (i = 0; i <= N; i++) {
      t = i / N;
      var sp = spinePoint(t, lean, len, bx, by, bow);
      // the beast's top edge ripples with the trot
      var wave = c * 3 * S * Math.sin(trotPhase - t * 4.5);
      pts.push({
        x: sp.x + sp.nx * wave, y: sp.y + sp.ny * wave,
        nx: sp.nx, ny: sp.ny, tx: sp.tx, ty: sp.ty, t: t
      });
    }

    // half-width profile: tall monolith tapering up with a shoulder
    // bulge; low ridge thickening toward the raised prow. Blended by c.
    function halfAt(t) {
      var manW = halfW * (1.08 - 0.52 * t) + halfW * 0.55 * Math.exp(-Math.pow((t - 0.72) / 0.13, 2));
      var beastW = halfW * 0.85 * (0.55 + 0.85 * t);
      return manW + (beastW - manW) * c;
    }

    // silhouette path: one side up, rounded cap, other side down
    ctx.beginPath();
    var p0 = pts[0];
    ctx.moveTo(p0.x + p0.nx * halfAt(0), p0.y + p0.ny * halfAt(0));
    for (i = 0; i <= N; i++) {
      var p = pts[i];
      ctx.lineTo(p.x + p.nx * halfAt(p.t), p.y + p.ny * halfAt(p.t));
    }
    // rounded prow cap
    var pTop = pts[N];
    ctx.arc(pTop.x, pTop.y, halfAt(1), Math.atan2(pTop.ny, pTop.nx), Math.atan2(-pTop.ny, -pTop.nx) + Math.PI, false);
    for (i = N; i >= 0; i--) {
      p = pts[i];
      ctx.lineTo(p.x - p.nx * halfAt(p.t), p.y - p.ny * halfAt(p.t));
    }
    ctx.closePath();
    ctx.fillStyle = INK;
    ctx.fill();

    // red-ochre wash hugging the sun-facing edge, narrow and faint
    ctx.beginPath();
    ctx.moveTo(pts[0].x - pts[0].nx * halfAt(0) * 0.4, pts[0].y - pts[0].ny * halfAt(0) * 0.4);
    for (i = 0; i <= N; i++) {
      p = pts[i];
      ctx.lineTo(p.x - p.nx * halfAt(p.t) * 0.62, p.y - p.ny * halfAt(p.t) * 0.62);
    }
    for (i = N; i >= 0; i--) {
      p = pts[i];
      ctx.lineTo(p.x - p.nx * halfAt(p.t) * 0.05, p.y - p.ny * halfAt(p.t) * 0.05);
    }
    ctx.closePath();
    ctx.fillStyle = OCHRE_RED;
    ctx.globalAlpha = 0.26;
    ctx.fill();
    ctx.globalAlpha = 1;

    // thin white-clay rim along the sun-facing top edge
    ctx.beginPath();
    var started = false;
    for (i = 0; i <= N; i++) {
      p = pts[i];
      if (p.t < 0.45) continue;
      var rx = p.x - p.nx * halfAt(p.t) * 0.98;
      var ry = p.y - p.ny * halfAt(p.t) * 0.98;
      if (!started) { ctx.moveTo(rx, ry); started = true; }
      else ctx.lineTo(rx, ry);
    }
    ctx.strokeStyle = CLAY;
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = 1.6 * S;
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.globalAlpha = 1;

    // the stone, on the shoulder while upright, fading out as he drops
    if (c < 0.35) {
      var sh = shoulderPos();
      // soft contact shadow where the stone meets the figure
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.beginPath();
      ctx.ellipse(sh.x, sh.y + stoneR() * 0.55, stoneR() * 0.8, stoneR() * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1 - c / 0.35;
      boulder(sh.x, sh.y, stoneR(), 0.06 * Math.sin(walkPhase));
      ctx.globalAlpha = 1;
    }
  }

  function drawDust() {
    var i, d;
    for (i = 0; i < dust.length; i++) {
      d = dust[i];
      var a = (1 - d.age / d.life) * 0.30;
      ctx.fillStyle = "rgba(169,143,102," + a.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r * (1 + d.age * 0.8), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function draw() {
    drawWall();
    drawGround();
    drawLight();

    if (looseStone) {
      ctx.globalAlpha = looseStone.alpha;
      boulder(looseStone.x, groundY() - looseStone.r * 0.55, looseStone.r, looseStone.rot);
      ctx.globalAlpha = 1;
    }

    drawFigure();
    drawDust();
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    if (exposedPhase() === "man") {
      readout.textContent = "man · stone " + Math.round(load * 100) + "%";
    } else {
      readout.textContent = "beast · the light is out of reach";
    }
    requestAnimationFrame(frame);
  }

  function setLabels(show) {
    labelsShown = show;
    for (var i = 0; i < labels.length; i++) {
      labels[i].classList.toggle("hidden", !show);
    }
  }

  function nearFigure(px, py) {
    var gy = groundY();
    var cx = x, cy = gy - 22 * S;
    var dx = px - cx, dy = py - cy;
    return Math.sqrt(dx * dx + dy * dy) < 90 * S;
  }

  var downPos = null;
  var downTime = 0;
  var lastTap = 0;

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    downPos = { x: e.clientX, y: e.clientY };
    downTime = performance.now();
    if (nearFigure(e.clientX, e.clientY)) {
      dragging = true;
      dragStartY = e.clientY;
    }
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    lift = Math.max(0, Math.min(1, (dragStartY - e.clientY) / (130 * S)));
  });

  function endPointer(e) {
    if (!downPos) return;
    var dt = performance.now() - downTime;
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    var moved = Math.sqrt(dx * dx + dy * dy);
    downPos = null;
    dragging = false;
    if (dt > 500 || moved > 12) return; // a drag, not a tap
    var now = performance.now();
    toggle();
    if (now - lastTap < 300) setLabels(!labelsShown);
    lastTap = now;
  }

  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", function () {
    downPos = null;
    dragging = false;
  });

  document.addEventListener("visibilitychange", function () {
    last = performance.now();
  });

  window.addEventListener("resize", resize);

  // Harness hook: read-only state for verification, not part of the piece.
  window.__876 = {
    state: function () {
      var gy = groundY();
      return {
        phase: exposedPhase(),
        rawPhase: phase,
        load: load,
        stoneR: stoneR(),
        bendDeg: spineDeg(),
        pace: pace(),
        lightAlpha: lightA,
        x: x,
        c: c,
        lift: lift,
        figX: x,
        figY: gy - 22 * S,
        w: W, h: H
      };
    },
    expectedBend: bendFor,
    setLoad: function (v) { load = Math.max(0, Math.min(1, v)); },
    forceMan: function () { phase = "man"; c = 0; load = 0.10; looseStone = null; },
    forceBeast: function () { startFall(); },
    toggle: toggle,
    labelsShown: function () { return labelsShown; }
  };

  x = 0;
  resize();
  x = W * 0.15;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
