<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pressure</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    touch-action: none;
    cursor: pointer;
  }
  .hint {
    position: fixed;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(180, 210, 255, 0.45);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
</style>
<!-- ig-preview-881-pressure 2026-11-28 -->
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Pressure &middot; hold to pressurize, release to emit</div>
<script>
(function () {
  "use strict";

  // Driver: one particle cloud breathing between a compact bright core
  // and emission on a slow clock. Compression pulls particles to a moving
  // core and brightness rises with density; emission splits the core and
  // sheds particles along curl-noise filaments. Brightness IS density.
  // After holotx, "Pressure --> emission". Silent: no audio.

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  function hashSeed(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var params = new URLSearchParams(window.location.search);
  var seedText = params.get("seed") || String(Math.floor(Math.random() * 1e9));
  var rng = mulberry32(hashSeed(seedText));

  var dpr = 1, W = 0, H = 0, R = 100; // R: core radius scale
  var t = 0;
  var PERIOD = 24; // seconds per full compress/release cycle
  var held = false;
  var holdTime = 0;
  var splits = 0;
  var lastSplitPhase = -1;
  var burst = 0; // emission impulse after a release, decays to 0
  var phaseLog = []; // {t, phase} transitions for the harness

  // Pre-rendered soft sprites: a glowing dot fades to transparent at
  // its edge, so the mass reads as fluid, not as hard discs.
  function makeSprite(inner, mid) {
    var s = document.createElement("canvas");
    s.width = 64; s.height = 64;
    var g = s.getContext("2d");
    var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, inner);
    grad.addColorStop(0.35, mid);
    grad.addColorStop(1, "rgba(0, 0, 0, 0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return s;
  }
  var spriteBlue = makeSprite("rgba(150, 210, 255, 1)", "rgba(60, 120, 255, 0.55)");
  var spriteWhite = makeSprite("rgba(255, 255, 255, 1)", "rgba(190, 230, 255, 0.6)");

  function phase() {
    // 0..1 across the cycle. < 0.45 compression, >= 0.45 emission.
    return (t % PERIOD) / PERIOD;
  }
  function phaseName(p) { return p < 0.45 ? "compress" : "emit"; }

  function coreCenter(time) {
    // The core wanders slowly on a lissajous path around the centre.
    return {
      x: W / 2 + Math.sin(time * 0.11) * W * 0.10,
      y: H / 2 + Math.sin(time * 0.073 + 1.7) * H * 0.08
    };
  }

  function curl(x, y, time) {
    // Cheap curl-ish noise from layered sines.
    var a = Math.sin(x * 0.011 + time * 0.35) + Math.sin(y * 0.013 - time * 0.22);
    var b = Math.cos(x * 0.009 - time * 0.27) + Math.cos(y * 0.012 + time * 0.31);
    return { x: Math.sin(a + b), y: Math.cos(a - b) };
  }

  var N = 2200;
  var parts = [];
  // NOTE: initial spawn happens after the first sizeCanvas() at the
  // bottom of this file. spawnPart() depends on W/H/R; spawning before
  // the canvas is sized puts every particle around (0,0), and the cloud
  // spends its first seconds flying in from the corner.
  function spawnPart(i, nearCore) {
    var c = coreCenter(t);
    var ang = rng() * Math.PI * 2;
    var rad = nearCore ? rng() * R * 0.5 : (0.4 + rng() * 1.1) * R;
    parts[i] = {
      x: c.x + Math.cos(ang) * rad,
      y: c.y + Math.sin(ang) * rad,
      vx: 0, vy: 0,
      size: 0.8 + rng() * 2.2,
      hue: 205 + rng() * 30, // deep blue to cyan
      seed: rng() * 1000,
      swirl: rng() * 2 - 1, // per-particle handedness
      orbit: (0.1 + rng() * 0.9) * R, // own radius around the core
      ang: rng() * Math.PI * 2,
      angVel: (0.3 + rng() * 0.7) * (rng() < 0.5 ? -1 : 1) // rad/s
    };
  }

  function sizeCanvas() {
    var vp = window.visualViewport;
    var w = vp ? vp.width : window.innerWidth;
    var h = vp ? vp.height : window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(W, H) * 0.26;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
  }

  function step(dt) {
    var prevPhase = phaseName(phase());
    t += dt;
    if (held) holdTime += dt;
    burst = Math.max(0, burst - dt * 0.5);
    var p = phase();
    var name = phaseName(p);
    if (name !== prevPhase) phaseLog.push({ t: t, phase: name });
    if (phaseLog.length > 200) phaseLog.shift();

    var c = coreCenter(t);
    // The split: during emission the core separates into two lobes that
    // drift apart and come back. Split factor 0..1.
    var split = 0;
    if (p >= 0.45) {
      split = Math.sin((p - 0.45) / 0.55 * Math.PI);
      if (lastSplitPhase < 0.45 && p >= 0.45) { splits++; }
    }
    lastSplitPhase = p;
    var lobeDx = split * R * 0.9;
    var lobeDy = split * R * 0.45;

    var compress = name === "compress";
    // Holding pressurizes: the clock slows toward compression and the
    // pull strengthens. Releasing jumps to emission with a burst.
    var pull = compress ? 0.3 : 0.25;
    if (held) pull = 1.6;
    // A little curl even while compressing, so the core churns instead
    // of sitting still.
    var emitStrength = compress ? 0.12 : (0.6 + 0.4 * split) + burst;

    // Substep the integration so a slow frame (large dt) cannot make
    // the particles slingshot past the core.
    var sub = Math.max(1, Math.ceil(dt / (1 / 60)));
    var h = dt / sub;
    for (var k = 0; k < sub; k++) integrate(h, c, lobeDx, lobeDy, pull, emitStrength, compress);
  }

  function integrate(dt, c, lobeDx, lobeDy, pull, emitStrength, compress) {
    for (var i = 0; i < N; i++) {
      var pt = parts[i];
      // Nearest lobe centre (two lobes while split, one while whole).
      var l1x = c.x - lobeDx, l1y = c.y - lobeDy;
      var l2x = c.x + lobeDx, l2y = c.y + lobeDy;
      var d1 = Math.hypot(pt.x - l1x, pt.y - l1y);
      var d2 = Math.hypot(pt.x - l2x, pt.y - l2y);
      var tx, ty, td;
      if (d1 < d2) { tx = l1x; ty = l1y; td = d1; } else { tx = l2x; ty = l2y; td = d2; }

      var dx = tx - pt.x, dy = ty - pt.y;
      var dist = td || 1;
      // Pull toward the core while compressing; drift outward while emitting.
      var damp = compress ? 0.92 : 0.95;
      var ax = (dx / dist) * pull * 80 * dt;
      var ay = (dy / dist) * pull * 80 * dt;
      // Orbit spring: each particle circles its own radius around the
      // nearest lobe, so the core is a filled churning disc — never a
      // point, never a hollow ring. The orbit angle advances, so the
      // disc churns even when the cloud is fully compressed.
      pt.ang += pt.angVel * dt * (compress ? 1 : 0.35);
      var ox = tx + Math.cos(pt.ang) * pt.orbit;
      var oy = ty + Math.sin(pt.ang) * pt.orbit;
      var oSpring = compress ? 4.0 : 0.08;
      ax += (ox - pt.x) * oSpring * dt;
      ay += (oy - pt.y) * oSpring * dt;
      var cu = curl(pt.x, pt.y, t + pt.seed);
      ax += cu.x * emitStrength * 55 * dt;
      ay += cu.y * emitStrength * 55 * dt;
      // Outward radial push during emission and burst.
      ax += (pt.x - c.x) / (dist + 40) * emitStrength * 34 * dt;
      ay += (pt.y - c.y) / (dist + 40) * emitStrength * 34 * dt;

      pt.vx = (pt.vx + ax) * damp;
      pt.vy = (pt.vy + ay) * damp;
      var spd = Math.hypot(pt.vx, pt.vy);
      if (spd > 30) { pt.vx *= 30 / spd; pt.vy *= 30 / spd; spd = 30; }
      pt.speed = spd;
      pt.px = pt.x; pt.py = pt.y; // trail start = position before the move
      pt.x += pt.vx * dt * 60 * 0.16;
      pt.y += pt.vy * dt * 60 * 0.16;

      // Keep the mass on the page: soft wrap.
      if (pt.x < -40) pt.x = W + 40; if (pt.x > W + 40) pt.x = -40;
      if (pt.y < -40) pt.y = H + 40; if (pt.y > H + 40) pt.y = -40;

      // Brightness is density: bright near a core, dim far away.
      var bright = Math.max(0.12, 1.25 - td / (R * 2.2));
      if (held) bright = Math.min(1, bright * 1.35);
      pt.bright = bright;
      pt.dist = td;
    }
  }

  function draw() {
    // Trails: fade toward black instead of clearing, so emitted
    // particles leave filaments that linger.
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(0, 0, 0, 0.16)";
    ctx.fillRect(0, 0, W, H);
    // The mass itself is drawn source-over, not additive: a blue dot
    // drawn over itself plateaus at blue, so the compressed core stays
    // luminous blue with white-hot specks instead of blowing out to a
    // flat white disc. Only fast particles get an additive streak.
    for (var i = 0; i < N; i++) {
      var pt = parts[i];
      var a = 0.35 + pt.bright * 0.45;
      var size = pt.size * 5 * (0.7 + pt.bright * 0.9);
      var spr = pt.bright > 0.96 ? spriteWhite : spriteBlue;
      ctx.globalAlpha = a;
      ctx.drawImage(spr, pt.x - size / 2, pt.y - size / 2, size, size);
    }
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (var j = 0; j < N; j++) {
      var q = parts[j];
      if ((q.speed || 0) < 3 || q.px === undefined) continue;
      ctx.globalAlpha = Math.min(0.6, (q.speed || 0) * 0.06) * (0.3 + (q.bright || 0) * 0.5);
      ctx.strokeStyle = "rgba(140, 200, 255, 1)";
      ctx.lineWidth = Math.max(1, q.size * 0.9);
      ctx.beginPath();
      ctx.moveTo(q.px, q.py);
      ctx.lineTo(q.x, q.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  var lastNow = 0;
  function frame(now) {
    var dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0.016;
    lastNow = now;
    step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function pressOn(e) {
    e.preventDefault();
    held = true;
    holdTime = 0;
  }
  function pressOff(e) {
    if (!held) return;
    e.preventDefault();
    held = false;
    // Release triggers emission: jump the clock into the emission phase
    // and give every particle an outward burst.
    var p = phase();
    if (p < 0.45) t += (0.45 - p) * PERIOD;
    burst = 1.0;
    for (var i = 0; i < N; i++) {
      var pt = parts[i];
      var c = coreCenter(t);
      var dx = pt.x - c.x, dy = pt.y - c.y;
      var d = Math.hypot(dx, dy) || 1;
      pt.vx += (dx / d) * (2.5 + holdTime * 0.9);
      pt.vy += (dy / d) * (2.5 + holdTime * 0.9);
    }
    holdTime = 0;
  }

  canvas.addEventListener("pointerdown", pressOn);
  canvas.addEventListener("pointerup", pressOff);
  canvas.addEventListener("pointercancel", pressOff);
  canvas.addEventListener("pointerleave", pressOff);

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", sizeCanvas);
    window.visualViewport.addEventListener("scroll", sizeCanvas);
  }
  window.addEventListener("resize", sizeCanvas);
  window.addEventListener("orientationchange", sizeCanvas);

  sizeCanvas();
  for (var i = 0; i < N; i++) spawnPart(i, false);
  draw();
  requestAnimationFrame(frame);

  // Diagnostics for the harness. Not visible on the page.
  window.__pressure = {
    seed: function () { return seedText; },
    time: function () { return t; },
    phase: function () { return phase(); },
    phaseName: function () { return phaseName(phase()); },
    splits: function () { return splits; },
    phaseLog: function () { return phaseLog.slice(); },
    held: function () { return held; },
    step: function (dt) { step(dt); draw(); },
    advance: function (dt) { step(dt); }, // physics only, no draw: fast sim
    press: function () { held = true; holdTime = 0; },
    release: function () {
      var ev = { preventDefault: function () {} };
      if (held) pressOff(ev);
    },
    size: function () { return { w: W, h: H }; },
    // Mean distance of particles from the core centre, and mean
    // brightness: compression should be small and bright, emission
    // wide and dimmer.
    stats: function () {
      var c = coreCenter(t);
      var dSum = 0, bSum = 0;
      for (var i = 0; i < N; i++) {
        dSum += Math.hypot(parts[i].x - c.x, parts[i].y - c.y);
        bSum += parts[i].bright || 0;
      }
      return { meanRadius: dSum / N / R, meanBrightness: bSum / N };
    }
  };
})();
</script>
</body>
</html>
