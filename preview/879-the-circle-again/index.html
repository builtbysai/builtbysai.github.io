<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Circle, Again</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f3eee1;
    overflow: hidden;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    touch-action: manipulation;
    cursor: pointer;
  }
  .hint {
    position: fixed;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(43, 47, 58, 0.45);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">The Circle, Again &middot; tap for a new hand</div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var PAPER = "#f3eee1";
  var INK = "30, 33, 42"; // charcoal with an indigo cast (darkened round 3)

  // Seeded RNG (mulberry32). ?seed= keeps the hand; no seed rolls a new one.
  function hashSeed(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var params = new URLSearchParams(window.location.search);
  var seedText = params.get("seed") || String(Math.floor(Math.random() * 1e9));
  var rng = mulberry32(hashSeed(seedText));

  // One hand: a few low harmonics, seeded phases and weights.
  // The same hand redraws the circle; its shape is stable across
  // passes, so the history of attempts stays legible.
  var HARMONICS = [];
  for (var h = 0; h < 4; h++) {
    HARMONICS.push({
      k: h + 2, // 2..5 lobes around the circle
      phase: rng() * Math.PI * 2,
      weight: 0.45 + rng() * 0.55,
      drift: 0 // round 4: no drift. The shape must not wander, or the
               // three sizes smear back into one band over a minute.
    });
  }
  var WOBBLE = 0.08; // peak radius perturbation, as a fraction of radius
  // Round 4 — the size ladder (new variable). Each attempt lands at one
  // of three remembered sizes, cycling -D, 0, +D, instead of at a random
  // radius. Passes concentrate on three rungs, so the three attempts
  // deepen into three permanent hairlines that never merge, and the
  // overlap darkness is held instead of thinned. D = 4.5% of radius:
  // ~4.9 px on phone, ~10.1 px on desktop; stroke ~1.2 px, so a paper
  // gap stays open between rungs at every angle, including the spoke.
  var RUNGS = [-0.045, 0, 0.045];
  var TREMOR_PHASE = 0.08; // per-pass phase tremor (radians): each redraw
                           // is a new attempt, but it stays on its rung
  var TREMOR_R = 0.002; // per-pass radius tremor, as a fraction of radius

  var dpr = 1, W = 0, H = 0, cx = 0, cy = 0, baseR = 0;
  var passCount = 0;
  var passRadii = []; // mean radius of each pass, for diagnostics
  var lastVertexRadii = []; // per-vertex radii of the latest pass
  var angleZeroRadii = []; // radius at theta=0 for each pass: the wobble history
  var lastPassTime = 0;
  var PASS_MS = 1000;
  var FADE = 0.06; // cream wash before each new pass; stack settles at ~16 passes

  function sizeCanvas() {
    var vp = window.visualViewport;
    var w = vp ? vp.width : window.innerWidth;
    var h = vp ? vp.height : window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
    baseR = Math.min(W, H) * 0.28;
    paintPaper();
  }

  function paintPaper() {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawPass(t) {
    // Fade the stack one step toward the paper.
    ctx.fillStyle = "rgba(243, 238, 225, " + FADE + ")";
    ctx.fillRect(0, 0, W, H);

    // This pass is a fresh attempt by the same hand: it lands on the
    // next rung of the size ladder, with only a small tremor, so it
    // never lands exactly on the last pass but never leaves its rung.
    var jitPhase = [];
    for (var j = 0; j < HARMONICS.length; j++) {
      jitPhase.push((rng() - 0.5) * TREMOR_PHASE);
    }
    var rungOffset = RUNGS[passCount % RUNGS.length] * baseR;
    var tremorR = (rng() - 0.5) * 2 * TREMOR_R * baseR;

    var N = 240;
    var rSum = 0;
    lastVertexRadii = [];
    ctx.beginPath();
    for (var i = 0; i <= N; i++) {
      var theta = (i / N) * Math.PI * 2;
      var sum = 0, wsum = 0;
      for (var k = 0; k < HARMONICS.length; k++) {
        var hm = HARMONICS[k];
        sum += hm.weight * Math.sin(hm.k * theta + hm.phase + hm.drift * t + jitPhase[k]);
        wsum += hm.weight;
      }
      var r = baseR * (1 + WOBBLE * (sum / wsum)) + rungOffset + tremorR;
      rSum += r;
      if (i < N) lastVertexRadii.push(r);
      if (i === 0) angleZeroRadii.push(r);
      var x = cx + r * Math.cos(theta);
      var y = cy + r * Math.sin(theta);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = "rgba(" + INK + ", 0.35)";
    ctx.lineWidth = Math.max(1.2, baseR * 0.006);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();

    passCount++;
    passRadii.push(rSum / (N + 1));
    if (passRadii.length > 400) passRadii.shift();
    if (angleZeroRadii.length > 400) angleZeroRadii.shift();
  }

  function frame(now) {
    if (now - lastPassTime >= PASS_MS) {
      lastPassTime = now;
      drawPass(now / 1000);
    }
    requestAnimationFrame(frame);
  }

  // A new hand: fresh seed, clean paper, same rules.
  function newHand() {
    seedText = String(Math.floor(Math.random() * 1e9));
    rng = mulberry32(hashSeed(seedText));
    for (var i = 0; i < HARMONICS.length; i++) {
      HARMONICS[i].phase = rng() * Math.PI * 2;
      HARMONICS[i].weight = 0.45 + rng() * 0.55;
      HARMONICS[i].drift = 0; // round 4: shape stays stable (see above)
    }
    passCount = 0;
    passRadii = [];
    paintPaper();
    lastPassTime = performance.now();
    drawPass(lastPassTime / 1000);
    try {
      history.replaceState(null, "", "?seed=" + seedText);
    } catch (e) { /* history unavailable; the hand still changed */ }
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    newHand();
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", sizeCanvas);
    window.visualViewport.addEventListener("scroll", sizeCanvas);
  }
  window.addEventListener("resize", sizeCanvas);
  window.addEventListener("orientationchange", sizeCanvas);

  sizeCanvas();
  lastPassTime = performance.now();
  drawPass(lastPassTime / 1000);
  requestAnimationFrame(frame);

  // Diagnostics for the harness. Not visible on the page.
  window.__circle = {
    seed: function () { return seedText; },
    passCount: function () { return passCount; },
    passRadii: function () { return passRadii.slice(); },
    vertexRadii: function () { return lastVertexRadii.slice(); },
    angleZeroRadii: function () { return angleZeroRadii.slice(); },
    baseR: function () { return baseR; },
    center: function () { return { x: cx, y: cy }; },
    size: function () { return { w: W, h: H }; }
  };
})();
</script>
</body>
</html>
